version: 2

project_name: simcitadel

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  # The citadel CLI ships for every platform a developer runs.
  - id: citadel
    main: ./cmd/citadel
    binary: citadel
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.buildDate={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  # The two sidecars ship as container images, so Linux alone is enough.
  - id: event-trigger
    main: ./cmd/event-trigger
    binary: event-trigger
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux]
    goarch: [amd64, arm64]

  - id: event-capture
    main: ./cmd/event-capture
    binary: event-capture
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: citadel
    ids: [citadel]
    name_template: "citadel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/**/*
      - examples/**/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers_v2:
  - id: event-trigger
    ids: [event-trigger]
    dockerfile: deploy/docker/event-trigger.Dockerfile
    images:
      - ghcr.io/andersonten/event-trigger
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: event-trigger
      org.opencontainers.image.description: Citadel event trigger sidecar. It turns an HTTP call into an AMQP message.
      org.opencontainers.image.source: https://github.com/andersonten/simcitadel
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"

  - id: event-capture
    ids: [event-capture]
    dockerfile: deploy/docker/event-capture.Dockerfile
    images:
      - ghcr.io/andersonten/event-capture
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: event-capture
      org.opencontainers.image.description: Citadel event capture sidecar. It records outbound AMQP messages and answers queries about them.
      org.opencontainers.image.source: https://github.com/andersonten/simcitadel
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Container images

    ```
    docker pull ghcr.io/andersonten/event-trigger:{{ .Version }}
    docker pull ghcr.io/andersonten/event-capture:{{ .Version }}
    ```
