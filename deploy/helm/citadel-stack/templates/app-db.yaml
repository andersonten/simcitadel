apiVersion: v1
kind: Secret
metadata:
  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "app-db-auth") }}
  labels:
    {{- include "citadel-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.appDb.auth.username | quote }}
  password: {{ .Values.appDb.auth.password | quote }}
  database: {{ .Values.appDb.auth.database | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "app-db") }}
  labels:
    {{- include "citadel-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "app-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "citadel-stack.labels" . | nindent 8 }}
        {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "app-db") | nindent 8 }}
    spec:
      {{- include "citadel-stack.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "citadel-stack.podSecurityContext" .Values.appDb.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.appDb.image.repository }}:{{ .Values.appDb.image.tag }}"
          imagePullPolicy: {{ .Values.appDb.image.pullPolicy }}
          args: ["-c", "wal_level=logical"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "app-db-auth") }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "app-db-auth") }}
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "app-db-auth") }}
                  key: database
            # The volume mounts one level above the data directory, so the
            # server creates the data directory itself and owns it.
            - name: PGDATA
              value: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
              protocol: TCP
          resources:
            {{- toYaml .Values.appDb.resources | nindent 12 }}
          securityContext:
            {{- include "citadel-stack.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # The server puts the Unix socket and the lock file here.
            - name: run
              mountPath: /var/run/postgresql
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "app-db") }}
  labels:
    {{- include "citadel-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "app-db") | nindent 4 }}
