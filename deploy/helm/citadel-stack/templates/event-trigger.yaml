apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "event-trigger") }}
  labels:
    {{- include "citadel-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "event-trigger") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "citadel-stack.labels" . | nindent 8 }}
        {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "event-trigger") | nindent 8 }}
    spec:
      {{- include "citadel-stack.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "citadel-stack.podSecurityContext" .Values.eventTrigger.podSecurityContext | nindent 8 }}
      containers:
        - name: event-trigger
          image: "{{ .Values.eventTrigger.image.repository }}:{{ .Values.eventTrigger.image.tag }}"
          imagePullPolicy: {{ .Values.eventTrigger.image.pullPolicy }}
          env:
            # The URL holds the broker credentials, so it comes from the Secret.
            - name: EVENT_TRIGGER_AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "rabbitmq-auth") }}
                  key: amqp-url
            # SDD section 14.5 row 14 requires the reference scenario to pass
            # under this chart with only a config change, so the chart must set
            # what the compose file sets. The publish budget of SDD section 7.6
            # bounds a closed loop, and a scenario that needs a higher budget
            # cannot raise it if the chart hardcodes the default.
            - name: EVENT_TRIGGER_PUBLISH_BUDGET
              value: {{ .Values.eventTrigger.publishBudget | quote }}
            - name: EVENT_TRIGGER_PUBLISH_CONFIRM_TIMEOUT
              value: {{ .Values.eventTrigger.publishConfirmTimeout | quote }}
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.eventTrigger.resources | nindent 12 }}
          securityContext:
            {{- include "citadel-stack.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "event-trigger") }}
  labels:
    {{- include "citadel-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "event-trigger") | nindent 4 }}
