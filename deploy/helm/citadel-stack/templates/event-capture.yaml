apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "event-capture") }}
  labels:
    {{- include "citadel-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "event-capture") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "citadel-stack.labels" . | nindent 8 }}
        {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "event-capture") | nindent 8 }}
    spec:
      {{- include "citadel-stack.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "citadel-stack.podSecurityContext" .Values.eventCapture.podSecurityContext | nindent 8 }}
      containers:
        - name: event-capture
          image: "{{ .Values.eventCapture.image.repository }}:{{ .Values.eventCapture.image.tag }}"
          imagePullPolicy: {{ .Values.eventCapture.image.pullPolicy }}
          env:
            # The URL holds the broker credentials, so it comes from the Secret.
            - name: EVENT_CAPTURE_AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "rabbitmq-auth") }}
                  key: amqp-url
            # The list of SDD section 8.1, in the name:mode form the binary
            # parses. The compose file carries the same list, and SDD section
            # 15 row 14 asks the reference scenario to pass here with only a
            # config change, so the chart must bind what compose binds.
            - name: EVENT_CAPTURE_EXCHANGES
              value: {{ include "citadel-stack.captureExchanges" . | quote }}
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.eventCapture.resources | nindent 12 }}
          securityContext:
            {{- include "citadel-stack.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "citadel-stack.componentName" (dict "root" . "component" "event-capture") }}
  labels:
    {{- include "citadel-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "citadel-stack.selectorLabels" (dict "root" . "component" "event-capture") | nindent 4 }}
