name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The same gate the Makefile runs: format, tidy, vet with and without the
      # integration tag, build, and the unit suites.
      - name: make verify
        run: make verify

      - name: race detector
        run: go test -race ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The suite starts its own RabbitMQ and PostgreSQL containers through
      # testcontainers. The runner already holds a Docker daemon.
      - name: container-backed tests
        run: make test-integration

  stack:
    name: compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every service must reach healthy from a clean volume. A first run is
      # the only run that catches a missing variable or a broken init step.
      - name: stack verify
        run: make stack-verify

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
